plugins {
    id 'com.android.application'
}

android {
    namespace 'org.fan.slidemeclassic'
    compileSdk 35
    defaultConfig {
        applicationId 'org.fan.slidemeclassic'
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
