plugins {
    id 'com.android.application'
}
android {
    namespace 'org.fan.slidemeclassic'
    compileSdk 35
    defaultConfig {
        applicationId 'org.fan.slidemeclassic'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }
    dependencies {
        implementation 'androidx.core:core:1.15.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
